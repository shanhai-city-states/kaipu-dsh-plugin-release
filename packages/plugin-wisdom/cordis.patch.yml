# 山海·开铺 · 会商组织插件 · patch 层
# =====================================================================
# ★★ 本文件是「可摘除」约束的一半：
#
#   会商组织 = **一个独立模块**。**摘掉本文件这段 insert + 删掉整个包目录**
#   ⇒ 场地插件（plugin-platform）**必须仍完整可用** —— 宿主能起、能接第三方
#   Agent、能出审计流程。
#
#   ⇒ 所以本包：
#     · **不许**被 plugin-platform 依赖（package.json 里也查得到）
#     · **不许**往场地插件的座位里塞东西
#     · **只**通过契约（@shanhai/kaipu-contract）与场地通信
#
# ★ 对外字段以 `wisdomTeam` 为准，同时保留 `expertTeam` 别名并存。

- insert:
    - id: shanhai-kaipu-wisdom-team
      name: '@shanhai/kaipu-wisdom-team'
      config:
        # 内置会商组织：使用者没带自己的 Agent 时开箱即用。
        # ★ 使用者带了自己的 Agent ⇒ 位置可被替换。
        builtinSample: true
        # 内置分组（后续版本可从服务端拉取；此处为本地兜底开关）
        lampGroups: []
